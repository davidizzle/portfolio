<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVDZ</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }

        /* Styling for text elements */
        #textAbove, #textBelow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            /* opacity: 0; Start invisible for fade-in */
            /* transition: opacity 0.5s ease-in-out; Smooth fade-in */
            /* Check this out: https://cubic-bezier.com/#.01,.68,.87,.39 */
            transition: top 1.5s cubic-bezier(.6,-0.16,.42,1.19); /* Smooth transition with easing */
        }

        #textAbove { top: 50%; }
        #textBelow { top: 46%; }

        /* Hide spans initially */
        .hidden-word {
            opacity: 0;
            transition: opacity 0.5s ease-in-out; /* Smooth fade-in */
        }

        /* Button styling */
        #myButton {
            position: absolute;
            bottom: 20px; /* 20px from the bottom of the window */
            left: 20px;   /* 20px from the left of the window */
            padding: 10px 20px;
            background-color: #212e3b;
            color: rgb(0, 155, 70);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        #myButton:hover {
            opacity: 1;
        }

            .description {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20%;
        }

        #left-description {
            left: 5%;
            text-align: left;
        }

        #right-description {
            right: 5%;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="textAbove"></div>
    <div id="textBelow"></div>
    <div id="left-description" class="description"></div>
    <div id="right-description" class="description"></div>
    <a href="https://davidizzle.github.io/chatbot-own">
        <button id="myButton">Get to know me.</button>
    </a>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- for fonts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <!-- for fading font -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <audio id="audioPlayer" controls style="display: none;">
        <source src="audio.mp3" type="audio/mpeg">
        Sorry, no Audio support.
    </audio>

    <script type="module">
        import SceneManager from './js/SceneManager.js';
        import RaycasterManager from './js/RaycasterManager.js';
        import ModelLoader from './js/ModelLoader.js';
        import TextManager from './js/textManager.js';
                
        // Scene setup, from SceneManager.js
        const sceneManager  = new SceneManager();
        const modelLoader   = new ModelLoader(sceneManager.scene);
        const raycaster     = new RaycasterManager(sceneManager, modelLoader);
        const textManager   = new TextManager();

        let targetPositions = []; // Array to store target positions for the transition

        // Text Variables and functions
        const textSets = [
            { above: "This is my personal website. Have a look around.", below: "Oh! Feel free to navigate with ← and → arrows." },
            { above: "Here, I keep a collection of my favorite projects.", below: "Let's explore some together!" },
            { above: "Under construction...", below: "Wow, such empty..." },
            { above: "Under construction...", below: "Wow, such empty..." },
            { above: "Under construction...", below: "Wow, such empty..." }
        ];
        const wordInterval = 150; // Time interval between words in milliseconds
        let lastWordTime = 1000; // Keeps track of when the last word was added
  
        // Set up the text spans for the above and below texts
        textManager.setupText(textManager.textBelowDiv, textManager.fullTextBelow);
        textManager.setupText(textManager.textAboveDiv, textManager.fullTextAbove);
        // for words to move up and down
        setTimeout(() => {
            textManager.textAboveDiv.style.top = '5%'; // Move textAbove upwards
            textManager.textBelowDiv.style.top = '90%'; // Move textBelow downwards
        }, 5000); // 5000 milliseconds = 5 seconds
        // End text variables

        // Slower jiggle effect
        let Time = 0; // Time variable for slow jiggle
        const timeSpeed = 1; // Speed of jiggle
        const margin = 1 // To draw lines
        let lastCheckedTime = 0; // Track last time the condition was checked
        function jiggleSpheres() {

            let spheres = modelLoader.spheres;

            let allArrived = true; // Flag to check if all spheres have arrived
            let marginTotal = 0;
            let activeSpheres = 0;

            modelLoader.spheres.forEach((sphere, index) => {
                const jiggleFactor = 1e-2;
                const offset_x = Math.sin(Time/10 + sphere.seed) * jiggleFactor;
                const offset_y = Math.sin(Time/10 + sphere.seed * 1.1) * jiggleFactor;
                const offset_z = Math.sin(Time/10 + sphere.seed * 1.5) * jiggleFactor;
                sphere.position.x += offset_x;
                sphere.position.y += offset_y;
                sphere.position.z += offset_z;

                // Interpolate positions towards target
                if (modelLoader.targetPositions[index]) {
                    sphere.position.lerp(modelLoader.targetPositions[index], 0.05); // Adjust the factor (0.05) for speed of transition
                }

                // If the target position is unchanged, spin around the object
                if (!modelLoader.targetPositions[index]) {
                            // let radius = ( Math.cos(Time * spinSpeed + sphere.seed) + 5) * 10 ; // Radius of the circular motion
                            const spinSpeed = 0.03; // Speed of the spin
                            sphere.theta = (Time - (Math.cos(Time * spinSpeed)^2 -1 )) * spinSpeed;
                            sphere.theta = (Time + Math.sin(Time) ) * spinSpeed;
                            sphere.theta = (Time ) * spinSpeed + 0.5 * Math.sin(Time * spinSpeed * 2 + Math.PI * 5 / 12 ) ;
                            sphere.phi = Time * spinSpeed  * sphere.seed4 + sphere.seed3;

                            // 100 is the main sphere radius, + a bit of slow wiggling
                            // sphere.radius = 100 + (Math.cos(Time * spinSpeed * 5 + sphere.seed) * sphere.seed2 * 5);
                            sphere.radius = 100;
                            // sphere.radius1 = ( Math.cos(Time * spinSpeed * 50 + sphere.seed) * sphere.seed2 + 8) * 10;
                            let y_off = 10;
                            let x0, y0, z0;
                            x0 = Math.cos(sphere.phi ) * Math.sin(sphere.theta) * sphere.radius;
                            z0 = Math.sin(sphere.phi) * Math.sin(sphere.theta) * sphere.radius;
                            y0 = Math.cos(sphere.theta) * sphere.radius + y_off; // Preserve the original y position
                            // Maintain original y position
                            // sphere.position.y = sphere.position.y; // Preserve the original y position

                            sphere.position.lerp(new THREE.Vector3(x0, y0, z0), spinSpeed);
                        }

                // Only draw lines within certain margin of desired sphere position
                if(modelLoader.targetPositions[index]) {
                    const distance = sphere.position.distanceTo(modelLoader.targetPositions[index]);
                    if (distance > margin) {
                        allArrived = false; // If any sphere has not arrived, set the flag to false
                    }
                    marginTotal += distance;
                    activeSpheres++;
                }
            });

            Time += timeSpeed; // Increment time for the next frame
            
            // Update lines after jiggling the spheres
            if (allArrived) {
                modelLoader.createLines(marginTotal / activeSpheres); // Use the global faces variable
            }

            const currentTime = performance.now() / 1000; // Get current time in seconds
        }

        // Load initial JSON file
        // Suggest edit: create big cube (or even tidus) and put it out of sight
        modelLoader.loadJSON('assets/json/tiduslat.json') // Replace with your initial JSON file path
            .then(data => modelLoader.updateScene(data));

        // Update the scene on click
        // window.addEventListener('click', loadNewJSON);
        window.addEventListener('keydown', function(event)  {
            if (event.key == 'ArrowRight') {
                modelLoader.loadNewJSON(1);
                textManager.updateTextForIndex(modelLoader.currentIndex)
            } else if (event.key == 'ArrowLeft') {
                modelLoader.loadNewJSON(-1);
                textManager.updateTextForIndex(modelLoader.currentIndex)
            }
            const audioPlayer = document.getElementById('audioPlayer');
                audioPlayer.muted = false; // Unmute in case it was muted
                audioPlayer.loop = true; // Enable looping
                audioPlayer.play().catch(error => {
                    console.error('Error playing audio:', error);
                });
        });
        window.addEventListener('ArrowDown', modelLoader.loadNewJSON(-1));
        window.addEventListener('touchstart', (event) => {
            event.preventDefault();
            modelLoader.loadNewJSON(1);
        });

        // Animation loop
        function animate(time) {
            requestAnimationFrame(animate);

            // Update hovering over models for every frame
            raycaster.update();

            jiggleSpheres(); // Call the jiggle function
            sceneManager.update();

            if (time < 1000)
            {
                return;
            }
            if (Math.abs(time - 8e3) < 10)
            {
                textManager.updateTextForIndex(0);
                modelLoader.loadNewJSON(1);
            }
            
            // Word part
            // Update the text word by word for the above element
            if (time - lastWordTime > wordInterval) {
                lastWordTime = time;
                
                // Update the text word by word for the below element
                // The odd logic makes sure that when there is a period, word generation pauses a little bit
                // TODO: Possibly move this logic all into textManager.js
                if (textManager.currWordIndexAbove == textManager.fullTextAbove.split(' ').length && textManager.currWordIndexBelow < textManager.fullTextBelow.split(' ').length) {
                    lastWordTime = ((textManager.fullTextBelow.split(' ')[textManager.currWordIndexBelow].slice(-1) == '.') ? (time + 800) : time);
                    textManager.revealWord(textManager.textBelowDiv, 'below');
                }
                if (textManager.currWordIndexAbove < textManager.fullTextAbove.split(' ').length) {
                    lastWordTime = ((textManager.fullTextAbove.split(' ')[textManager.currWordIndexAbove].slice(-1) == '.') ? (time + 800) : time);
                    textManager.revealWord(textManager.textAboveDiv, 'above');
                }
            }
        }

        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            sceneManager.renderer.setSize(window.innerWidth, window.innerHeight);
            sceneManager.camera.aspect = window.innerWidth / window.innerHeight;
            sceneManager.camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
